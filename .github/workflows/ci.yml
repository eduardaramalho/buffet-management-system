name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: mysql://user:password@localhost:3306/buffet_test
      JWT_ACCESS_SECRET: ci-only-access-secret
      CORS_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure test environment
        run: cp .env.example .env

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        run: node ../../.github/scripts/coverage-summary.mjs backend coverage/coverage-summary.json 85

      - name: Build backend
        run: npx tsc -p tsconfig.build.json

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        run: node ../../.github/scripts/coverage-summary.mjs frontend coverage/coverage-summary.json 80

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage
          if-no-files-found: error

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: e2e-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pe2e-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      E2E_DATABASE_URL: mysql://root:e2e-root-password@127.0.0.1:3306/buffet_management_e2e
      E2E_BACKEND_PORT: 3100
      E2E_FRONTEND_PORT: 5174
      JWT_ACCESS_SECRET: ci-only-e2e-access-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix apps/backend
          npm ci --prefix apps/frontend
          npm ci --prefix apps/e2e

      - name: Install Playwright browser
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium

      - name: Typecheck E2E suite
        working-directory: apps/e2e
        run: npm run typecheck

      - name: Run E2E journey
        working-directory: apps/e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          if-no-files-found: ignore

  sonar:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historico completo para o Sonar calcular "New Code" e blame corretamente.
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage

      - name: Rewrite coverage paths relative to repository root
        # Jest e Vitest geram "SF:src/...", mas o Sonar resolve a partir da raiz do monorepo.
        run: |
          sed -i 's#^SF:src/#SF:apps/backend/src/#' apps/backend/coverage/lcov.info
          sed -i 's#^SF:src/#SF:apps/frontend/src/#' apps/frontend/coverage/lcov.info

      - name: SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Deploy contínuo em produção (ADR 0011): só em push na main, depois de todos os checks.
  # Publica as imagens no GHCR e atualiza a VM da Azure via `az vm run-command` (sem SSH).
  deploy:
    needs: [e2e, sonar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nunca dois deploys ao mesmo tempo; um deploy em andamento não é cancelado por um push novo.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define image names
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "BACKEND_IMAGE=${prefix}/backend:${GITHUB_SHA}"
            echo "FRONTEND_IMAGE=${prefix}/frontend:${GITHUB_SHA}"
            echo "IMAGE_PREFIX=${prefix}"
          } >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}
            ${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: true
          # Vazio: o frontend chama /api/v1 na mesma origem, roteado pelo Caddy.
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ env.FRONTEND_IMAGE }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Generate production environment file
        env:
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          for name in DOMAIN ACME_EMAIL AZURE_RESOURCE_GROUP AZURE_VM_NAME MYSQL_ROOT_PASSWORD MYSQL_PASSWORD JWT_ACCESS_SECRET ADMIN_INITIAL_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Configuração ausente: ${name}"; exit 1; fi
          done
          umask 077
          cat > "$RUNNER_TEMP/production.env" <<EOF
          DOMAIN=${DOMAIN}
          ACME_EMAIL=${ACME_EMAIL}
          BACKEND_IMAGE=${BACKEND_IMAGE}
          FRONTEND_IMAGE=${FRONTEND_IMAGE}
          MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
          MYSQL_DATABASE=buffet_management
          MYSQL_USER=buffet
          MYSQL_PASSWORD=${MYSQL_PASSWORD}
          JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
          ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
          LOG_LEVEL=info
          EOF

      - name: Build remote deployment script
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/scripts/build-remote-script.sh "$RUNNER_TEMP/production.env" "$RUNNER_TEMP/remote-deploy.sh"

      - name: Azure login (OIDC, sem senha armazenada)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to the Azure VM
        run: |
          az vm run-command invoke \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --command-id RunShellScript \
            --scripts @"$RUNNER_TEMP/remote-deploy.sh" \
            --query "value[0].message" --output tsv > "$RUNNER_TEMP/deploy-output.txt"
          cat "$RUNNER_TEMP/deploy-output.txt"
          # O run-command não repassa o código de saída do script; o marcador confirma que ele chegou ao fim.
          grep -q "DEPLOY_OK" "$RUNNER_TEMP/deploy-output.txt" || { echo "::error::Deploy não concluído na VM"; exit 1; }

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "https://${DOMAIN}/api/v1/health"
          curl --fail --silent --show-error --output /dev/null "https://${DOMAIN}/"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://${DOMAIN}/api/v1/metrics")"
          [ "$status" = "404" ] || { echo "::error::/api/v1/metrics exposto publicamente (HTTP ${status})"; exit 1; }

      - name: Remove temporary files
        if: always()
        run: rm -f "$RUNNER_TEMP/production.env" "$RUNNER_TEMP/remote-deploy.sh" "$RUNNER_TEMP/deploy-output.txt"
