name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: mysql://user:password@localhost:3306/buffet_test
      JWT_ACCESS_SECRET: ci-only-access-secret
      CORS_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure test environment
        run: cp .env.example .env

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build backend
        run: npx tsc -p tsconfig.build.json

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage
          if-no-files-found: error

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: e2e-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pe2e-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      E2E_DATABASE_URL: mysql://root:e2e-root-password@127.0.0.1:3306/buffet_management_e2e
      E2E_BACKEND_PORT: 3100
      E2E_FRONTEND_PORT: 5174
      JWT_ACCESS_SECRET: ci-only-e2e-access-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            apps/e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix apps/backend
          npm ci --prefix apps/frontend
          npm ci --prefix apps/e2e

      - name: Install Playwright browser
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium

      - name: Typecheck E2E suite
        working-directory: apps/e2e
        run: npm run typecheck

      - name: Run E2E journey
        working-directory: apps/e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          if-no-files-found: ignore

  sonar:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historico completo para o Sonar calcular "New Code" e blame corretamente.
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage

      - name: Rewrite coverage paths relative to repository root
        # Jest e Vitest geram "SF:src/...", mas o Sonar resolve a partir da raiz do monorepo.
        run: |
          sed -i 's#^SF:src/#SF:apps/backend/src/#' apps/backend/coverage/lcov.info
          sed -i 's#^SF:src/#SF:apps/frontend/src/#' apps/frontend/coverage/lcov.info

      - name: SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Job de deploy: sera adicionado quando a hospedagem for definida (Trilha 3).
