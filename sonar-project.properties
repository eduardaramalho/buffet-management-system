sonar.organization=eduardaramalho
sonar.projectKey=eduardaramalho_buffet-management-system

sonar.sources=apps/backend/src,apps/frontend/src
sonar.tests=apps/backend/src,apps/frontend/src
sonar.test.inclusions=apps/**/src/**/*.spec.ts,apps/**/src/**/*.test.ts,apps/**/src/**/*.spec.tsx,apps/**/src/**/*.test.tsx
# Arquivos de teste ficam fora de sonar.sources para nao serem indexados duas vezes.
# Codigo gerado pelo Prisma e setup de testes nao sao codigo de producao.
sonar.exclusions=apps/**/src/**/*.spec.ts,apps/**/src/**/*.test.ts,apps/**/src/**/*.spec.tsx,apps/**/src/**/*.test.tsx,apps/backend/src/generated/**,apps/frontend/src/test/**
sonar.coverage.exclusions=apps/backend/src/server.ts
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/frontend/coverage/lcov.info